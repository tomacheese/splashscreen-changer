name: Build and Release

on:
  # Use pull_request_target only (pull_request is intentionally not used)
  # pull_request_target fires for both fork PRs and same-repository PRs
  # Fork PRs: blocked by the approval gate of environment: fork-pr-build
  # Same-repository PRs: environment is '', so no approval is needed
  pull_request_target:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:

# Disable default permissions for the whole workflow (each job declares its minimum permissions)
permissions: {}

# Prevent runs from piling up on every synchronize
# Including event_name keeps cancellation independent between different events
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post-approval-request:
    name: Post approval request
    runs-on: ubuntu-latest
    # Post the approval request only for fork PRs (not needed for same-repository PRs)
    # Excluded on closed events, where no approval comment is needed
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed'
    # A failed comment post must not affect the workflow conclusion (the security gate is the environment:)
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Find existing approval request comment
        id: find-comment
        # Pin to a commit SHA in write-permission jobs on pull_request_target to reduce supply-chain risk
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Environment 承認待ち

      - name: Post or update approval request comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Environment 承認待ち

            この PR のビルドを実行するには、Environment `fork-pr-build` の承認が必要です。

            [Actions run を確認して承認してください](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})

  build-and-release:
    runs-on: ubuntu-latest
    needs: post-approval-request
    # Always run regardless of the post-approval-request result
    # The security gate is the environment:, so a failed comment post must not cause this job to be skipped
    # Skip the job when the PR is closed without merging (avoids unnecessary runs)
    if: >-
      always() &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    # Manual approval via the Environment is required only for fork PRs (not for same-repository PRs)
    # No approval needed on closed events:
    #   - closed + merged == true  -> runs against the checked-out base branch code (safe)
    #   - closed + merged == false -> never runs; the if: condition skips the job itself
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed' && 'fork-pr-build' || '' }}
    permissions:
      contents: write
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merged == true && github.base_ref || github.event.pull_request.head.sha || github.sha }}

      - name: 🏷️ Bump version and push tag
        id: tag-version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: "minor"
          custom_release_rules: "feat:minor:✨ Features,fix:patch:🐛 Fixes,docs:patch:📰 Docs,chore:patch:🎨 Chore,perf:patch:🎈 Performance improvements,refactor:patch:🧹 Refactoring,build:patch:🔍 Build,ci:patch:🔍 CI,revert:patch:⏪ Revert,style:patch:🧹 Style,test:patch:👀 Test,release:major:📦 Release"
          dry_run: ${{ github.event.pull_request.merged == true && 'false' || 'true' }}

      - name: 🏷️ Fetch tags
        run: git fetch --tags

      - name: 🛠️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: 📦 Install dependencies
        run: go mod download

      - name: 🧪 Test
        run: go test -v ./...

      - name: 🚀 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Using merged != true makes merge_group events (where merged is an empty string) safely produce a snapshot build
          # merged == false would not work: GitHub Actions' loose comparison does not treat an empty string as equal to false
          args: release --clean ${{ github.event.pull_request.merged != true && '--skip=validate,publish --snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

      - name: 🧹 Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
